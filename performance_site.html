<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perf review drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --font-cond:"Barlow Condensed","Arial Narrow",var(--font-ui);
  --bg:#E9EEEA; --surface:#F8FAF7; --plot-bg:#FBFCF9; --ink:#15212C; --muted:#56666E; --rule:#B9C8BE;
  --grid-minor:#DCE7DF; --grid-major:#A8C1B0; --accent:#1C57A5; --accent-ink:#FFFFFF;
  --trace-drag:#1C57A5; --trace-mil:#BF3624; --trace-max:#B97F06; --trace-q:#8A2A85; --trace-ray:#2A7A4B; --hl:#E7EFE9;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#131D23; --plot-bg:#0F181D; --ink:#DCE5E9; --muted:#8FA1A9; --rule:#2A3A43;
  --grid-minor:#18262D; --grid-major:#2B414B; --accent:#74B4FF; --accent-ink:#0D1418;
  --trace-drag:#74B4FF; --trace-mil:#FF7A68; --trace-max:#F0C14B; --trace-q:#E28BE0; --trace-ray:#6ED49B; --hl:#172A33; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#131D23; --plot-bg:#0F181D; --ink:#DCE5E9; --muted:#8FA1A9; --rule:#2A3A43;
  --grid-minor:#18262D; --grid-major:#2B414B; --accent:#74B4FF; --accent-ink:#0D1418;
  --trace-drag:#74B4FF; --trace-mil:#FF7A68; --trace-max:#F0C14B; --trace-q:#E28BE0; --trace-ray:#6ED49B; --hl:#172A33; color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-ui);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.page{max-width:880px;margin:0 auto;padding:0 16px 64px}
header.top{padding:28px 0 14px;border-bottom:3px solid var(--ink)}
header.top h1{font:700 clamp(34px,8vw,56px)/0.95 var(--font-cond);letter-spacing:-0.01em;margin:0}
header.top p{margin:10px 0 0;max-width:60ch;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:0;border-bottom:1px solid var(--rule);margin:0 -16px;padding:0 16px}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 17px var(--font-cond);padding:12px 14px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:500 14px var(--font-ui);padding:5px 11px;border-radius:3px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 15px var(--font-ui);padding:8px 14px;border-radius:3px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q{border-top:1px solid var(--ink);padding:18px 0 22px}
.q[hidden]{display:none}
.q-head{display:grid;grid-template-columns:118px 1fr;gap:4px 16px;align-items:baseline}
.q-sec{font:600 15px var(--font-cond);color:var(--accent)}
.q-head h3{margin:0;font:600 24px/1.15 var(--font-cond)}
.q-body,.q-actions,.q-charts,.q-sol,.concept-a,.q .note{margin-left:134px}
.prompt{margin:8px 0 12px;max-width:66ch;font-size:17px}
dl.given{margin:0;display:grid;gap:0;max-width:520px}
dl.given div{display:flex;align-items:baseline;gap:8px;padding:3px 0}
dl.given dt{color:var(--muted);flex:0 0 auto}
dl.given div::after{content:"";order:1;flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
dl.given dd{margin:0;order:2;font-weight:600;text-align:right}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.q-sol{margin-top:16px;border-left:3px solid var(--accent);padding:4px 0 4px 16px}
.ans{display:grid;gap:4px;margin-bottom:12px}
.ans div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ans span{color:var(--muted)}
.ans b{font-size:18px}
ol.steps{margin:0;padding-left:22px;max-width:70ch}
ol.steps li{margin:0 0 8px;padding-left:4px}
.mini{border-collapse:collapse;margin:8px 0;font-size:14px}
.mini th,.mini td{border:1px solid var(--rule);padding:3px 8px;text-align:right;white-space:nowrap}
.mini th{font-weight:600;background:var(--hl)}
.mini tr.hl td{background:var(--hl);font-weight:600}
.mini.wide td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto;max-width:100%}
.concept-a{max-width:66ch;margin-top:12px}
.q .note,.note{color:var(--muted);font-size:14px;font-style:italic;margin-top:6px}
/* plots */
.q-charts{margin-top:16px;display:grid;gap:22px}
.plot-title{font:600 17px/1.2 var(--font-cond);margin-bottom:6px}
.plot-title small{display:block;font:400 14px/1.35 var(--font-ui);color:var(--muted);margin-top:2px}
.plot-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tog{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--muted);font:500 13px var(--font-ui);padding:4px 10px 4px 24px;border-radius:3px;cursor:pointer;position:relative}
.tog::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border:1.5px solid currentColor;border-radius:2px}
.tog.on{color:var(--ink);border-color:var(--ink)}
.tog.on::before{background:var(--accent);border-color:var(--accent)}
.plot-wrap{border:1px solid var(--rule);background:var(--plot-bg);width:100%}
.plot-wrap canvas{display:block;width:100%}
.plot-nudge{display:flex;align-items:center;gap:6px;margin-top:8px}
.plot-nudge .nhint{flex:1;text-align:center;color:var(--muted);font-size:13px}
.nb{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 18px/1 var(--font-ui);width:40px;height:36px;border-radius:3px;cursor:pointer}
.plot-readout{margin-top:8px;background:var(--surface);border:1px solid var(--rule);padding:10px 12px}
.ro-head{display:flex;flex-wrap:wrap;gap:4px 22px;margin-bottom:6px}
.ro-head span{color:var(--muted);font-size:13px;margin-right:6px}
.ro-head b{font-size:20px}
.plot-readout table{border-collapse:collapse;width:100%;font-size:14px}
.plot-readout th{text-align:left;font-weight:500;color:var(--muted);padding:2px 8px 2px 0;white-space:nowrap}
.plot-readout th i{display:inline-block;width:10px;height:3px;margin-right:7px;vertical-align:middle}
.plot-readout td{text-align:right;font-weight:600;padding:2px 0}
/* charts tab */
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;margin:18px 0}
.controls label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.controls select,.controls input{font:500 16px var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:7px 9px;min-width:150px}
.controls [hidden]{display:none}
#c-host{display:grid;gap:26px}
/* data */
#data section{border-top:1px solid var(--ink);padding:18px 0}
#data h2{font:700 30px/1 var(--font-cond);margin:0 0 10px}
#data h3{font:600 20px var(--font-cond);margin:22px 0 6px}
#data p{max-width:68ch}
.eq{font-size:17px;padding:6px 12px;border-left:3px solid var(--rule);background:var(--surface);display:inline-block}
@media (max-width:640px){
  .q-head{grid-template-columns:1fr}
  .q-body,.q-actions,.q-charts,.q-sol,.concept-a,.q .note{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div class="page">
<header class="top"><h1>Perf review drills</h1>
<p>Your review questions with fresh numbers every time, flown on the NT-38, a notional T-38-class trainer. The charts and the worked solutions come from the same model, so what you read off the chart is what the answer uses.</p></header>
<nav class="tabs" role="tablist">
<button type="button" role="tab" data-p="p-practice" aria-selected="true">Practice</button>
<button type="button" role="tab" data-p="p-charts" aria-selected="false">Charts</button>
<button type="button" role="tab" data-p="p-data" aria-selected="false">Aircraft data</button>
</nav>
<main>
<div class="panel" id="p-practice">
<div class="bar"><div class="chips" aria-label="Filter by section"></div><button type="button" class="btn" id="all-new">New numbers for every question</button></div>
<div id="qlist"></div>
</div>
<div class="panel" id="p-charts" hidden>
<div class="controls">
<label>Chart<select id="c-type">
<option value="thrust">Thrust and drag</option><option value="lift">Drag polar and lift limit</option><option value="speed">Airspeed and impact pressure</option><option value="hu">HU-16B power required</option></select></label>
<label id="c-alt-wrap">Altitude<select id="c-alt"></select></label>
<label id="c-w-wrap">Add a weight curve (lb)<input id="c-w" type="number" inputmode="numeric" placeholder="e.g. 11250" step="50"></label>
</div>
<div id="c-host"></div>
</div>
<div class="panel" id="p-data" hidden><div id="data"></div></div>
</main>
</div>
<script>
// ===== Performance model (pure functions, no DOM) =====
const G = 32.174, P0 = 2116.22, RHO0 = 0.0023769, A0 = 1116.45, KT = 1.68781, A0KT = A0 / KT;
function atm(h) {
  let th, dl;
  if (h <= 36089) { th = 1 - 6.87559e-6 * h; dl = Math.pow(th, 5.2559); }
  else { th = 0.751865; dl = 0.223361 * Math.exp(-(h - 36089) / 20806); }
  const sg = dl / th;
  return { h, theta: th, delta: dl, sigma: sg, P: P0 * dl, rho: RHO0 * sg, a: A0 * Math.sqrt(th), aKt: A0KT * Math.sqrt(th), T: 518.67 * th };
}
// Monotone cubic (Fritsch-Carlson) interpolant, flat outside range
function pchip(xs, ys) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
function lin(xs, ys) {
  return x => { if (x <= xs[0]) return ys[0]; if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
    let i = 0; while (x > xs[i + 1]) i++; return ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]); };
}
const NT = {
  name: 'NT-38', S: 170, ZFW: 9151, fuelMax: 3900, CLmaxTO: 0.80, nlim: 7.33, tsfcMil: 1.09, tsfcMax: 2.2,
  CD0base: 0.0180, TmilSLS: 5360, TmaxSLS: 7700,
  tblDCD0: { M: [0, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.20, 1.30], v: [0, 0, 0.0003, 0.0012, 0.0040, 0.0105, 0.0200, 0.0270, 0.0295, 0.0290, 0.0270, 0.0255] },
  tblK: { M: [0, 0.85, 0.90, 1.00, 1.10, 1.20, 1.30], v: [0.106, 0.106, 0.108, 0.125, 0.160, 0.190, 0.210] },
  tblCLmax: { M: [0, 0.40, 0.60, 0.70, 0.80, 0.90, 1.00, 1.30], v: [0.95, 0.95, 0.90, 0.86, 0.80, 0.72, 0.68, 0.62] },
};
NT.dCD0 = pchip(NT.tblDCD0.M, NT.tblDCD0.v);
NT.Kf = pchip(NT.tblK.M, NT.tblK.v);
NT.CLmax = lin(NT.tblCLmax.M, NT.tblCLmax.v);
NT.CD0 = M => NT.CD0base + NT.dCD0(M);
NT.CD = (M, CL) => NT.CD0(M) + NT.Kf(M) * CL * CL;
NT.qS = (M, h) => 0.7 * atm(h).P * M * M * NT.S;
NT.drag = (M, h, W) => { const qs = NT.qS(M, h), CL = W / qs; return qs * NT.CD(M, CL); };
NT.Tmil = (M, h) => NT.TmilSLS * (1 - 0.35 * M + 0.40 * M * M) * Math.pow(atm(h).sigma, 0.8);
NT.Tmax = (M, h) => NT.TmaxSLS * (1 - 0.20 * M + 0.55 * M * M) * Math.pow(atm(h).sigma, 0.8);
function argmax(f, a, b, step = 0.001) {
  let bx = a, bv = -Infinity;
  for (let x = a; x <= b + 1e-9; x += step) { const v = f(x); if (v > bv) { bv = v; bx = x; } }
  let lo = Math.max(a, bx - step), hi = Math.min(b, bx + step);
  for (let i = 0; i < 60; i++) { const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3; if (f(m1) < f(m2)) lo = m1; else hi = m2; }
  return (lo + hi) / 2;
}
NT.stallM = (h, W) => { let lo = 0.02, hi = 1.3; for (let i = 0; i < 60; i++) { const M = (lo + hi) / 2; if (NT.qS(M, h) * NT.CLmax(M) < W) lo = M; else hi = M; } return (lo + hi) / 2; };
NT.maxMilMach = (h, W) => { // highest Mach where Tmil >= D
  for (let M = 1.3; M > 0.2; M -= 0.001) if (NT.Tmil(M, h) >= NT.drag(M, h, W)) {
    let lo = M, hi = M + 0.001; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (NT.Tmil(m, h) >= NT.drag(m, h, W)) lo = m; else hi = m; } return lo; }
  return NaN;
};
NT.bestRangeMach = (h, W) => argmax(M => M / NT.drag(M, h, W), 0.3, 1.2);
NT.bestEndMach = (h, W) => argmax(M => -NT.drag(M, h, W), 0.2, 1.2);
NT.Ps = (M, h, W, mode = 'mil') => { const V = M * atm(h).a; const T = mode === 'mil' ? NT.Tmil(M, h) : NT.Tmax(M, h); return V * (T - NT.drag(M, h, W)) / W; };
NT.maxRocMach = (h, W) => argmax(M => NT.Ps(M, h, W), 0.2, 1.0);
// Airspeeds
function qcFromMach(M, P) { if (M <= 1) return P * (Math.pow(1 + 0.2 * M * M, 3.5) - 1); return P * (166.9216 * Math.pow(M, 7) / Math.pow(7 * M * M - 1, 2.5) - 1); }
function machFromQc(qc, P) { let lo = 0, hi = 5; for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (qcFromMach(m, P) < qc) lo = m; else hi = m; } return (lo + hi) / 2; }
function kcasFromMach(M, h) { return machFromQc(qcFromMach(M, atm(h).P), P0) * A0KT; }
function machFromKcas(Vc, h) { return machFromQc(qcFromMach(Vc / A0KT, P0), atm(h).P); }
function keasFromMach(M, h) { return M * atm(h).aKt * Math.sqrt(atm(h).sigma); }
// HU-16B notional model
const HU = { name: 'HU-16B', S: 1035, b: 96.67, e: 0.75, CD0: 0.032 };
HU.AR = HU.b * HU.b / HU.S; HU.K = 1 / (Math.PI * HU.AR * HU.e);
HU.drag = (Vkt, W, h = 0) => { const V = Vkt * KT, q = 0.5 * atm(h).rho * V * V, CL = W / (q * HU.S); return { q, CL, CD: HU.CD0 + HU.K * CL * CL, D: q * HU.S * (HU.CD0 + HU.K * CL * CL) }; };
HU.Preq = (Vkt, W, h = 0) => HU.drag(Vkt, W, h).D * Vkt * KT; // ft-lb/s
// ===== Helpers =====
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fc = (x, d = 0) => Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rnd = (a, b, s) => a + s * Math.floor(Math.random() * (Math.round((b - a) / s) + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const alt = h => h === 0 ? 'sea level' : fc(h) + ' ft';
const R2D = 180 / Math.PI;
const S = { cursor: true, ray: true, showMax: false, qcurve: false };
try { const s = JSON.parse(localStorage.getItem('perfdrill-settings-v2') || '{}'); Object.assign(S, s); } catch (e) {}
function saveS() { try { localStorage.setItem('perfdrill-settings-v2', JSON.stringify(S)); } catch (e) {} }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r))), m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }

// ===== Plot engine =====
const PLOTS = new Set();
class Plot {
  constructor(host, specFn) {
    this.specFn = specFn; this.cx = null;
    this.root = el('div', 'plot');
    this.title = el('div', 'plot-title');
    this.tools = el('div', 'plot-tools');
    this.wrap = el('div', 'plot-wrap');
    this.canvas = el('canvas'); this.wrap.appendChild(this.canvas);
    this.nudge = el('div', 'plot-nudge');
    this.readout = el('div', 'plot-readout');
    this.root.append(this.title, this.tools, this.wrap, this.nudge, this.readout);
    host.appendChild(this.root);
    const setX = e => { const r = this.canvas.getBoundingClientRect(); const px = e.clientX - r.left; const sp = this.spec, p = this.pad;
      const x = sp.xMin + (px - p.l) / (this.pw) * (sp.xMax - sp.xMin); this.cx = Math.min(sp.xMax, Math.max(sp.xMin, x)); this.draw(); };
    this.canvas.addEventListener('pointerdown', e => { if (!S.cursor) return; this.canvas.setPointerCapture(e.pointerId); setX(e); });
    this.canvas.addEventListener('pointermove', e => { if (!S.cursor) return; if (e.pointerType === 'mouse' || this.canvas.hasPointerCapture(e.pointerId)) setX(e); });
    this.ro = new ResizeObserver(() => this.draw()); this.ro.observe(this.wrap);
    PLOTS.add(this); this.rebuild();
  }
  rebuild() {
    this.spec = this.specFn(); const sp = this.spec;
    this.title.innerHTML = sp.title + (sp.sub ? `<small>${sp.sub}</small>` : '');
    this.tools.innerHTML = '';
    const tog = (key, label) => { const b = el('button', 'tog' + (S[key] ? ' on' : ''), label); b.type = 'button'; b.setAttribute('aria-pressed', S[key]);
      b.onclick = () => { S[key] = !S[key]; saveS(); PLOTS.forEach(p => p.isConnected() ? p.rebuild() : PLOTS.delete(p)); }; this.tools.appendChild(b); };
    tog('cursor', 'Cursor readout');
    if (sp.ray != null) tog('ray', 'Origin ray');
    if (sp.hasQ) tog('qcurve', 'Question curve');
    if (sp.maxToggle) tog('showMax', 'MAX thrust');
    if (this.cx == null || this.cx < sp.xMin || this.cx > sp.xMax) this.cx = sp.cx0 ?? (sp.xMin + sp.xMax) / 2;
    this.nudge.innerHTML = '';
    if (S.cursor) {
      const mk = (t, d, lbl) => { const b = el('button', 'nb', t); b.type = 'button'; b.setAttribute('aria-label', lbl); b.onclick = () => { this.cx = Math.min(sp.xMax, Math.max(sp.xMin, this.cx + d)); this.draw(); }; return b; };
      this.nudge.append(mk('«', -sp.xNudge * 10, 'Step left, large'), mk('‹', -sp.xNudge, 'Step left'), el('span', 'nhint', 'Drag across the chart or step the cursor'), mk('›', sp.xNudge, 'Step right'), mk('»', sp.xNudge * 10, 'Step right, large'));
    }
    this.nudge.hidden = !S.cursor; this.readout.hidden = !S.cursor;
    this.canvas.style.touchAction = S.cursor ? 'pan-y' : 'auto';
    this.draw();
  }
  isConnected() { return this.root.isConnected; }
  draw() {

const CONCEPTS = [
{ tag: 'Takeoff', q: 'What is the largest contributor to takeoff distance uncertainty? How do you minimize it?',
  a: 'Pilot technique: rotation speed, pitch rate and liftoff attitude vary from run to run and dominate the scatter in ground roll and air distance. Minimize it by defining the procedure tightly (power setting and brake release, rotation speed, rotation rate, target attitude), briefing and practicing it, and flying repeat points. Then measure and correct for weight, wind, runway slope and temperature, the next largest contributors.' },
{ tag: 'Modeling and sim', q: 'What types of performance modeling and simulation are available?',
  a: 'Comparison with similar aircraft (historical data), spreadsheet or analytical methods (handbook buildups), CFD, water tunnel and wind tunnel.' },
{ tag: 'Modeling and sim', q: 'How are these methods different?',
  a: 'Fidelity against cost and time. Comparison and spreadsheet methods are fast and cheap but coarse. CFD adds physics detail but costs computing time and needs validation. A water tunnel shows flow patterns (vortices, separation) qualitatively at low Reynolds number. A wind tunnel gives quantitative forces and moments but is expensive and carries scale, wall and support effects. More fidelity costs more.' },
{ tag: 'Modeling and sim', q: 'How do you use CFD or wind tunnel results in performance work?',
  a: 'Increment testing. Absolute predictions carry model errors, but the difference between two configurations is far more reliable. Start from a flight-test-validated baseline, apply the CFD or tunnel increment (for example ΔC<sub>D</sub> for a new store), and confirm with a limited set of flight test points.' },
{ tag: 'Modeling and sim', q: 'How do you estimate performance before flight?',
  a: 'Build a drag polar (C<sub>D0</sub> from a component buildup, K from 1/πeAR or tunnel data, compressibility rise), model installed thrust and fuel flow from the engine deck with installation losses, then compute thrust-required and thrust-available curves, P<sub>s</sub>, turn, range and takeoff. Update the model as flight data arrives. Your course slides are the authority on the exact method.' },
{ tag: 'Propulsion, general', q: 'Why does turbojet thrust fall with altitude, and how does TSFC behave?',
  a: 'Thrust scales roughly with inlet mass flow, which follows density, so T ≈ T<sub>SL</sub>σ<sup>n</sup> with n near 0.7 to 1. TSFC falls slightly up to the tropopause because colder inlet air improves cycle efficiency, is roughly constant above it, and rises with Mach number because of ram drag.' },
{ tag: 'Propulsion, general', q: 'What is ram drag, and why can MIL thrust still rise with Mach?',
  a: 'Ram drag is the momentum of captured free-stream air, ṁV<sub>0</sub>, subtracted from gross thrust. At the same time ram compression in the inlet raises engine pressure ratio and mass flow. Which effect wins depends on the engine and Mach; for many turbojets thrust dips at low Mach and recovers at higher Mach, which is the shape used in the NT-38 model.' },
{ tag: 'Propulsion, general', q: 'What separates installed thrust from uninstalled thrust?',
  a: 'Inlet pressure recovery losses, bleed air and horsepower extraction, spillage drag and nozzle or boattail drag. Engine decks usually give uninstalled values, so performance models apply installation corrections.' },
{ tag: 'High-speed aero, general', q: 'Define critical Mach and drag divergence Mach.',
  a: 'Critical Mach is the free-stream Mach at which local flow first reaches Mach 1 somewhere on the aircraft. Drag divergence Mach is where drag starts to climb steeply, commonly defined as dC<sub>D</sub>/dM = 0.1 or a ΔC<sub>D0</sub> of 0.002. M<sub>DD</sub> is above M<sub>crit</sub>.' },
{ tag: 'High-speed aero, general', q: 'Why does wing sweep delay compressibility effects?',
  a: 'To first order only the velocity component normal to the leading edge sets the pressure distribution, so the wing behaves as if flying at M cos Λ. That raises critical Mach and softens the drag rise, at the cost of lower lift-curve slope and tip-stall tendencies.' },
{ tag: 'High-speed aero, general', q: 'What is the transonic area rule?',
  a: 'Wave drag near Mach 1 depends mainly on how the total cross-sectional area varies along the length. A smooth area distribution (for example, waisting the fuselage where the wing adds area, as on the T-38) reduces the transonic drag peak.' },
];

function renderCharts(host, charts) { host.innerHTML = ''; charts.forEach(ch => new Plot(host, () => SPEC[ch.type](ch))); }
function questionCard(Qd) {
  const card = el('article', 'q'); card.dataset.sec = Qd.sec;
  let data;
  const head = el('header', 'q-head', `<span class="q-sec">${SECTIONS[Qd.sec]}</span><h3>${Qd.title}</h3>`);
  const body = el('div', 'q-body');

  const bNew = el('button', 'btn', 'New numbers'), bChart = el('button', 'btn', 'Show chart'), bSol = el('button', 'btn primary', 'Show solution');
  [bNew, bChart, bSol].forEach(b => b.type = 'button');
  const chartHost = el('div', 'q-charts'), sol = el('div', 'q-sol');
  card.append(head, body, actions, chartHost, sol);
  function fill() {
    data = Qd.gen();
    body.innerHTML = `<p class="prompt">${data.prompt}</p><dl class="given">${data.given.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
    actions.innerHTML = ''; actions.append(bNew); if (data.charts) actions.append(bChart); actions.append(bSol);
    sol.hidden = true; sol.innerHTML = ''; bSol.textContent = 'Show solution';
    if (!chartHost.hidden && data.charts) renderCharts(chartHost, data.charts); else { chartHost.hidden = true; chartHost.innerHTML = ''; bChart.textContent = 'Show chart'; }
  }
  bNew.onclick = fill;
  bChart.onclick = () => { if (chartHost.hidden) { chartHost.hidden = false; renderCharts(chartHost, data.charts); bChart.textContent = 'Hide chart'; } else { chartHost.hidden = true; chartHost.innerHTML = ''; bChart.textContent = 'Show chart'; } };
  bSol.onclick = () => {
    if (!sol.hidden) { sol.hidden = true; bSol.textContent = 'Show solution'; return; }
    sol.innerHTML = `<div class="ans">${data.answers.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div><ol class="steps">${data.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
    sol.hidden = false; bSol.textContent = 'Hide solution';
  };
  chartHost.hidden = true; sol.hidden = true; fill();
  card.refresh = fill; return card;
}
function conceptCard(c) {
  const card = el('article', 'q concept'); card.dataset.sec = 'concepts';
  card.innerHTML = `<header class="q-head"><span class="q-sec">${c.tag}</span><h3>${c.q}</h3></header>`;
  if (/general/.test(c.tag)) card.appendChild(el('p', 'note', 'Your sheet says “see slides.” This is a general review item, not taken from your slides.'));
  const b = el('button', 'btn', 'Show answer'); b.type = 'button'; const a = el('p', 'concept-a', c.a); a.hidden = true;
  b.onclick = () => { a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; };
  const act = el('div', 'q-actions'); act.appendChild(b); card.append(act, a); return card;
}
let filter = 'all';
function buildPractice() {
  const list = $('#qlist'); list.innerHTML = '';
  QUESTIONS.forEach(q => list.appendChild(questionCard(q)));
  CONCEPTS.forEach(c => list.appendChild(conceptCard(c)));
  applyFilter();
}
function applyFilter() { document.querySelectorAll('#qlist .q').forEach(c => c.hidden = !(filter === 'all' || c.dataset.sec === filter)); document.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter)); }
function buildChips() {
  const ch = $('.chips'); [['all', 'All'], ...Object.entries(SECTIONS)].forEach(([k, v]) => { const b = el('button', '', v); b.type = 'button'; b.dataset.f = k; b.onclick = () => { filter = k; applyFilter(); }; ch.appendChild(b); });
}
// Charts tab
function buildChartsTab() {
  const typeSel = $('#c-type'), altSel = $('#c-alt'), wIn = $('#c-w'), host = $('#c-host');
  [0, 5000, 10000, 15000, 20000, 25000, 30000, 35000, 40000].forEach(h => altSel.appendChild(new Option(alt(h).replace(/^s/, 'S'), h)));
  altSel.value = 30000;
  const draw = () => {
    const t = typeSel.value; const w = parseFloat(wIn.value); const wOk = isFinite(w) && w >= 8000 && w <= 32000;
    $('#c-alt-wrap').hidden = t !== 'thrust'; $('#c-w-wrap').hidden = !(t === 'thrust' || t === 'hu');
    host.innerHTML = '';
    if (t === 'lift') { renderCharts(host, [{ type: 'polar' }, { type: 'clmax' }]); return; }
    if (t === 'speed') { renderCharts(host, [{ type: 'airspeed' }, { type: 'qc' }]); return; }
    renderCharts(host, [{ type: t, h: +altSel.value, qW: wOk ? [w] : [] }]);
  };
  typeSel.onchange = altSel.onchange = draw; wIn.oninput = draw;
  return draw;
}
// Data tab

  const W = 12000, Vs = Math.sqrt(2 * W / (RHO0 * NT.S * NT.CLmaxTO)) / KT;
  const W1 = 9151 + 3100, W2 = 9151 + 1100, Wa = (W1 + W2) / 2, Mr = NT.bestRangeMach(30000, Wa), Rr = Mr * atm(30000).aKt * 2000 / (1.09 * NT.drag(Mr, 30000, Wa));
  $('#data').innerHTML = `

  <div><dt>Limit load factor</dt><dd>+7.33 g</dd></div><div><dt>C<sub>Lmax</sub>, takeoff configuration</dt><dd>0.80</dd></div><div><dt>TSFC, MIL and part power</dt><dd>1.09 (lb/hr)/lb</dd></div><div><dt>TSFC, MAX</dt><dd>2.2 (lb/hr)/lb</dd></div></dl>
  <h3>Drag polar</h3><p class="eq">C<sub>D</sub> = C<sub>D0</sub>(M) + K(M) C<sub>L</sub>², with C<sub>D0</sub> = 0.0180 + ΔC<sub>D0</sub>(M)</p>
  <p>Compressibility increment ΔC<sub>D0</sub> (monotone cubic interpolation):</p><div class="scroll">${tb(NT.tblDCD0.M, NT.tblDCD0.v, 4)}</div>
  <p>Induced drag factor K (monotone cubic interpolation):</p><div class="scroll">${tb(NT.tblK.M, NT.tblK.v, 3)}</div>
  <p>C<sub>Lmax</sub>, clean (linear interpolation):</p><div class="scroll">${tb(NT.tblCLmax.M, NT.tblCLmax.v, 2)}</div>
  <h3>Thrust</h3><p class="eq">T<sub>MIL</sub> = 5,360 (1 − 0.35M + 0.40M²) σ<sup>0.8</sup></p><p class="eq">T<sub>MAX</sub> = 7,700 (1 − 0.20M + 0.55M²) σ<sup>0.8</sup></p>
  <h3>Atmosphere and airspeed</h3><p>Standard atmosphere: θ = 1 − 6.87559×10⁻⁶ h and δ = θ<sup>5.2559</sup> below 36,089 ft; isothermal above. P<sub>0</sub> = 2,116.22 psf, ρ<sub>0</sub> = 0.0023769 slug/ft³, a<sub>0</sub> = 661.48 kt.</p>
  <p class="eq">q = 0.7 P M²,  q<sub>c</sub> = P[(1 + 0.2M²)<sup>3.5</sup> − 1] (subsonic; Rayleigh pitot formula above M 1)</p>

  <table class="mini wide"><tr><th>Item</th><th>This model</th><th>Your key</th></tr>
  <tr><td>V<sub>stall</sub>, 12,000 lb, sea level</td><td>${(Vs / A0KT).toFixed(4)} M</td><td>0.245 M</td></tr>
  <tr><td>Liftoff speed</td><td>${(1.1 * Vs).toFixed(0)} KCAS</td><td>178 KCAS</td></tr>
  <tr><td>Obstacle clearance speed</td><td>${(1.2 * Vs).toFixed(0)} KCAS</td><td>194 KCAS</td></tr>
  <tr><td>Max ROC Mach, sea level MIL, 12,000 lb</td><td>${NT.maxRocMach(0, 12000).toFixed(3)} M</td><td>0.65 M</td></tr>
  <tr><td>Range to BINGO, 30,000 ft, sheet numbers</td><td>${fc(Rr)} nm</td><td>745 nm</td></tr></table>
  <p class="note">These match by design. Other answers from your class handout will not match, because the NT-38 is not the real T-38.</p></section>
  <section><h2>HU-16B, simplified</h2>
  <dl class="given"><div><dt>Wing area</dt><dd>1,035 ft²</dd></div><div><dt>Span</dt><dd>96.67 ft (AR ${HU.AR.toFixed(2)})</dd></div><div><dt>Oswald efficiency</dt><dd>0.75</dd></div><div><dt>C<sub>D0</sub></dt><dd>0.032</dd></div><div><dt>K = 1/πeAR</dt><dd>${HU.K.toFixed(4)}</dd></div></dl>
  <p>Standardization assumes thrust horsepower available does not change between the test and standard speeds, and uses this polar for power required.</p></section>`;
}
// Tabs
function initTabs(drawCharts) {
  let chartsDrawn = false;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== b.dataset.p);
    if (b.dataset.p === 'p-charts' && !chartsDrawn) { drawCharts(); chartsDrawn = true; }
    window.scrollTo({ top: 0 });
  });
}
buildChips(); buildPractice(); buildData();
const drawCharts = buildChartsTab(); initTabs(drawCharts);
$('#all-new').onclick = () => document.querySelectorAll('#qlist .q').forEach(c => c.refresh && c.refresh());
</script></body></html>
